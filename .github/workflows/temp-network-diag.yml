name: TEMP - SBP network reachability diagnostic (delete after use) (retrigger 1)

# Phase 6A.5 fetch-origin validation — tests whether THIS runner's network
# can reach easydata.sbp.org.pk without hitting Cloudflare's bot challenge
# (confirmed, via a separate investigation, to block Vercel's production
# serverless IPs). No API key needed for this probe — Cloudflare's challenge
# fires before SBP's own auth check runs, so reachability is what's being
# tested, not credentials. Result is POSTed to a temporary admin route that
# logs it into the existing cron_run_log table (job_name=network-diag-probe)
# using the same CRON_SECRET/APP_URL already configured for every other
# workflow in this repo — no new secrets. Delete this file once answered.

on:
  push:
    paths:
      - ".github/workflows/temp-network-diag.yml"
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe SBP EasyData reachability and report result
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          RESP=$(curl -s -i -m 15 "https://easydata.sbp.org.pk/api/v1/series/TS_GP_BAM_M2_W.M000070/data?api_key=diagnostic-probe&start_date=2026-01-01&format=json")
          echo "----- raw response (first 2000 chars) -----"
          echo "$RESP" | head -c 2000
          echo ""
          echo "--------------------------------------------"

          ENCODED=$(printf '%s' "$RESP" | head -c 2000 | base64 -w0)
          PAYLOAD=$(printf '{"origin":"github-actions-ubuntu-latest","encoded":"%s"}' "$ENCODED")

          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "FATAL: APP_URL or CRON_SECRET not configured — cannot report result."
            exit 1
          fi

          curl -s -X POST "${APP_URL}/api/admin/network-diag" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
