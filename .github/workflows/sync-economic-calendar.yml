# Sync Economic Calendar — Phase 5 (Latest Data First)
#
# Fires every 15 minutes and calls the scheduler-agnostic sync pipeline
# (src/lib/economicCalendar/automation/syncPipeline.ts). All sync logic
# is in that module — this workflow is a thin cron adapter.
#
# With 15-minute polling, official data lands on the dashboard within
# ~15 minutes of SBP EasyData updating, which itself updates on the same day
# as each PBS/SBP official release. Previous Vercel-only approach: up to
# 13-hour lag (release at 10:00 PKT, Vercel cron at 23:00 PKT).
#
# The existing Vercel cron (vercel.json, 18:00 UTC daily) remains active as a
# safety net. The pipeline is idempotent — running it twice does not double-write
# or overwrite confirmed data.
#
# Required GitHub repository configuration:
#   secrets.CRON_SECRET  — must match CRON_SECRET set on Vercel
#   vars.APP_URL         — deployed base URL, e.g. https://your-app.vercel.app
#                          (set in: Settings → Secrets and variables → Variables)
#
# The x-github-run-id header enables Phase 4's scheduler detection
# (schedulerMeta.ts), so each run is logged as "github-actions" with the run ID
# as schedulerVersion in sync_trigger_log — visible in the System Health dashboard.

name: Sync Economic Calendar

on:
  schedule:
    # Every 15 minutes, all day, every day. Catches any release within ~15 min.
    # GitHub Actions free tier: 2,000 min/month for private repos.
    # Baseline: ~2,880 runs/month. Adaptive windows add ~300 runs/month.
    - cron: '*/15 * * * *'

    # ── Adaptive release windows ────────────────────────────────────────────
    # Each window fires every 5 minutes during the known publication window for
    # a specific indicator. This cuts detection latency from ~15 min to ~5 min
    # on the days/hours when it matters most, with minimal extra CI cost.

    # CPI / Core Inflation: PBS publishes on the 1st of each month at ~14:00 PKT
    # (09:00 UTC). Window: 08:30–13:30 UTC (13:30–18:30 PKT) on the 1st.
    # Covers late publication, Friday-1st delays, and EasyData propagation lag.
    - cron: '*/5 8-13 1 * *'

    # SPI: PBS publishes every Thursday at ~11:00–13:00 PKT (06:00–08:00 UTC).
    - cron: '*/5 6-8 * * 4'

    # Trade Balance (PBS advance release): published ~16th–18th of month
    # at ~10:00–12:00 PKT (05:00–07:00 UTC).
    - cron: '*/5 5-8 15,16,17,18 * *'

    # FX Reserves (SBP Forex_Arch.xlsx): updated Thursdays/Fridays alongside
    # the press release. Thursday window is shared with SPI above. Friday:
    - cron: '*/5 5-9 * * 5'

    # LSM: PBS publishes 5th–18th of M+2 at ~10:00–12:00 PKT (05:00–07:00 UTC).
    # 15-minute polling is sufficient here; no dedicated window needed — the
    # 15-min cron picks up LSM within 15 minutes across the full 5th–18th range.

  workflow_dispatch:
    # Manual trigger — available from the Actions tab in GitHub UI.
    # Useful for on-demand refresh immediately after a known PBS/SBP release.
    # The x-trigger-type header is set to "manual" in this case so the
    # sync_trigger_log entry is correctly categorized.

jobs:
  sync:
    name: Trigger sync pipeline
    runs-on: ubuntu-latest
    # Hard ceiling: the sync endpoint has maxDuration=300s (5 min) on Vercel.
    # Set the job timeout slightly above that to catch genuine hangs without
    # the workflow itself running forever.
    timeout-minutes: 8

    steps:
      - name: Call sync endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TRIGGER_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}
        run: |
          echo "=== Sync trigger ==="
          echo "run=${{ github.run_id }} event=${{ github.event_name }} time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ── Pre-flight: validate APP_URL is configured ────────────────────────
          # vars.APP_URL is a GitHub repository variable (not a secret).
          # If it is unset or empty the curl URL becomes "/api/cron/..." (no scheme),
          # curl exits with code 3 (URL malformed), and set -e kills the script
          # before any diagnostic output is printed — which is why the logs show
          # only "Process completed with exit code 3" with no further detail.
          if [ -z "${APP_URL}" ]; then
            echo "FATAL: APP_URL is empty or not configured."
            echo "Set it in GitHub → Settings → Secrets and variables → Variables → APP_URL"
            echo "Value must be the full Vercel deployment URL, e.g. https://your-app.vercel.app"
            exit 1
          fi

          ENDPOINT="${APP_URL}/api/cron/sync-economic-calendar"
          # Print endpoint host (safe — APP_URL is a variable, not a secret).
          echo "endpoint: ${ENDPOINT}"

          # ── Call the sync endpoint ────────────────────────────────────────────
          # -S: show errors on stderr even in silent mode
          # -s: suppress progress meter
          # -D -: dump response headers to stdout
          # -w: append structured metrics after body
          # set +e: prevent curl non-zero exit from killing the script before we
          #   can print diagnostics; we handle the exit code manually below.
          set +e
          response=$(curl -sS \
            --max-time 420 \
            -D - \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-github-run-id: ${{ github.run_id }}" \
            -H "x-github-workflow: ${{ github.workflow }}" \
            -H "x-trigger-type: ${TRIGGER_TYPE}" \
            -w '\n===curl-metrics===\nhttp_code=%{http_code}\ntime_total=%{time_total}s\ntime_connect=%{time_connect}s\ntime_starttransfer=%{time_starttransfer}s\nsize_download=%{size_download}bytes\n' \
            "${ENDPOINT}" 2>&1)
          curl_exit=$?
          set -e

          # ── Diagnostics: always print before any exit ─────────────────────────
          echo ""
          echo "=== curl exit code: ${curl_exit} ==="
          if [ "${curl_exit}" -ne 0 ]; then
            echo "curl failed before receiving a response."
            echo "Common causes:"
            echo "  exit 3  = URL malformed (APP_URL empty or missing https://)"
            echo "  exit 6  = could not resolve host (DNS failure or wrong domain)"
            echo "  exit 7  = connection refused (server not listening)"
            echo "  exit 28 = timeout (server took >420s)"
            echo ""
            echo "=== curl output (may contain error details) ==="
            echo "${response}" | head -c 4000
            exit "${curl_exit}"
          fi

          # ── Parse headers / body / metrics from combined output ───────────────
          # curl -D - emits headers then a blank line then body.
          # We appended the ===curl-metrics=== block at the very end via -w.
          metrics_block=$(echo "${response}" | sed -n '/^===curl-metrics===/,$p')
          http_code=$(echo "${metrics_block}" | grep '^http_code=' | cut -d= -f2)
          time_total=$(echo "${metrics_block}" | grep '^time_total=' | cut -d= -f2)

          # Body is everything between the blank header-separator and the metrics block.
          body=$(echo "${response}" | awk '
            /^\r?$/ && !body_started { body_started=1; next }
            /^===curl-metrics===/ { exit }
            body_started { print }
          ')

          echo "=== Response headers ==="
          echo "${response}" | awk '/^===curl-metrics===/{exit} 1' | head -30

          echo ""
          echo "=== HTTP ${http_code} — request took ${time_total} ==="
          echo ""
          echo "=== Response body (first 4000 chars) ==="
          echo "${body}" | head -c 4000

          echo ""
          echo "=== curl metrics ==="
          echo "${metrics_block}"

          # ── Fail the workflow if the endpoint returned non-200 ────────────────
          if [ "${http_code}" != "200" ]; then
            echo ""
            echo "FAIL: sync endpoint returned HTTP ${http_code} (expected 200)"
            exit 1
          fi

          echo "OK: sync pipeline completed successfully."
